name: Publish WhatsApp entry route

on:
  schedule:
    # Five-minute cadence offset from the top of each hour.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: acbot-public-entry-route
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'carlosmaximianoneto-debug/soregrigeracao' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Check route guardrails
        run: python3 -B -m unittest discover -s tests -p test_publish_route.py
      - name: Validate route and publish only index.html
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/publish_route.py
