[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The build embeds the shared category rules into an imported server module.
# No broad included_files glob is needed; operations and source snapshots stay private.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/site-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
